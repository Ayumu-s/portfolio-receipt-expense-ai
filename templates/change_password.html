<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワード変更</title>
    <link rel="stylesheet" href="/assets/app.css">
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
    {% include "_nav.html" %}
    <main class="mx-auto max-w-2xl px-4 py-10 sm:px-6 sm:py-14">
        <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
            <p class="text-sm font-bold tracking-[0.16em] text-blue-700">ACCOUNT SECURITY</p>
            <h1 class="mt-3 text-3xl font-bold tracking-tight">パスワード変更</h1>
            {% if current_user.must_change_password %}
            <div class="mt-5 rounded-2xl border border-amber-200 bg-amber-50 px-4 py-3 text-sm leading-6 text-amber-900" role="alert">
                初回ログインのため、6文字以上の新しいパスワードへ変更してください。変更後にレシートを利用できます。
            </div>
            {% endif %}
            {% if error %}
            <div class="mt-5 rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700" role="alert">{{ error }}</div>
            {% endif %}
            <form method="post" action="/account/password" class="mt-7 space-y-5">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <div>
                    <label for="currentPassword" class="mb-1 block text-sm font-medium text-slate-700">現在のパスワード</label>
                    <input id="currentPassword" name="current_password" type="password" autocomplete="current-password" maxlength="128" required class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
                </div>
                <div>
                    <label for="newPassword" class="mb-1 block text-sm font-medium text-slate-700">新しいパスワード</label>
                    <input id="newPassword" name="new_password" type="password" autocomplete="new-password" minlength="6" maxlength="128" required class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
                </div>
                <div>
                    <label for="newPasswordConfirm" class="mb-1 block text-sm font-medium text-slate-700">新しいパスワード（確認）</label>
                    <input id="newPasswordConfirm" name="new_password_confirm" type="password" autocomplete="new-password" minlength="6" maxlength="128" required class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
                </div>
                <button type="submit" class="w-full rounded-xl bg-blue-600 px-4 py-3.5 text-sm font-semibold text-white hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-200">変更してセッションを更新</button>
            </form>
        </div>
    </main>
</body>
</html>
