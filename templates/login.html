<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン</title>
    <link rel="stylesheet" href="/assets/app.css">
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
    <main class="flex min-h-screen items-center justify-center px-4 py-10">
        <div class="w-full max-w-md rounded-3xl border border-slate-200 bg-white p-7 shadow-[0_18px_50px_rgba(15,23,42,0.08)] sm:p-9">
            <div class="mb-7 flex items-center gap-3">
                <span class="flex h-11 w-11 items-center justify-center rounded-2xl bg-blue-600 text-sm font-bold text-white shadow-sm">経</span>
                <div>
                    <p class="text-xs font-bold uppercase tracking-[0.18em] text-blue-700">Receipt Desk</p>
                    <p class="text-sm font-semibold text-slate-700">レシート管理</p>
                </div>
            </div>
            <h1 class="text-3xl font-bold tracking-tight text-slate-900">ログイン</h1>
            <p id="loginHelp" class="mt-2 text-sm leading-6 text-slate-500">ユーザー名またはメールアドレスでログインします。</p>

            {% if registered %}
            <div class="mt-5 rounded-2xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-800" role="status">
                登録が完了しました。作成した情報でログインしてください。
            </div>
            {% endif %}

            {% if error %}
            <div class="mt-5 rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
                {{ error }}
            </div>
            {% endif %}

            <form method="post" action="/login" class="mt-7 space-y-5">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                <div>
                    <label for="identifier" class="block text-sm font-medium text-slate-700 mb-1">ユーザー名またはメールアドレス</label>
                    <input id="identifier" name="identifier" type="text" autocomplete="username" maxlength="320" required autofocus
                        class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm text-slate-800 outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700 mb-1">パスワード</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required
                        class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm text-slate-800 outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
                </div>

                <button type="submit"
                    class="w-full rounded-xl bg-blue-600 px-4 py-3.5 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-200">
                    ログイン
                </button>
            </form>
            <p class="mt-6 border-t border-slate-100 pt-5 text-center text-xs leading-5 text-slate-500">新規登録には管理者が発行した招待リンクが必要です。</p>
        </div>
    </main>
</body>
</html>
