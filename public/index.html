<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>経費管理アプリ</title>
    <link rel="stylesheet" href="/assets/app.css">
    <link rel="stylesheet" href="/ui-assets/ui.css">
    <link id="demoStylesheet" rel="stylesheet" disabled>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900" data-view-state="loading" data-demo-mode="false">
    <nav id="siteNav" class="hidden sticky top-0 z-30 border-b border-slate-200 bg-white/95 shadow-sm backdrop-blur" aria-label="メインナビゲーション">
        <div class="mx-auto flex min-h-16 max-w-6xl items-center justify-between px-4 sm:px-6">
            <a href="/" class="flex items-center gap-2.5 text-slate-900 transition-colors hover:text-blue-700">
                <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-blue-600 text-sm font-bold text-white shadow-sm" aria-hidden="true">経</span>
                <span class="text-base font-bold">経費管理アプリ</span>
            </a>
            <div id="desktopLinks" class="hidden items-center gap-1 md:flex"></div>
            <button id="navToggle" type="button" class="inline-flex min-h-11 min-w-11 items-center justify-center rounded-xl border border-slate-200 text-slate-600 transition-colors hover:bg-slate-50 hover:text-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 md:hidden" aria-label="メニューを開く" aria-expanded="false" aria-controls="mobileMenu">
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
        </div>
        <div id="mobileMenu" class="hidden border-t border-slate-100 bg-white px-4 py-3 md:hidden" aria-label="モバイルメニュー">
            <div id="mobileLinks" class="space-y-1"></div>
        </div>
    </nav>
    <p id="demoNotice" class="demo-mode-banner hidden" role="status">PORTFOLIO DEMO · 架空データを使用しています。Mock解析のため外部AIには接続しません。</p>
    <div id="viewStatus" class="mx-auto max-w-6xl px-4 py-4 text-sm text-slate-500 sm:px-6" role="status" aria-live="polite">読み込み中…</div>
    <main id="appView" class="hidden" aria-busy="true"></main>
    <div id="globalAlert" class="hidden ui-global-alert mx-auto max-w-6xl px-4 sm:px-6" role="alert"></div>
    <script type="module" src="/ui-assets/app.js"></script>
</body>
</html>
